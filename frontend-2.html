<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ча До — Реєстрація</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --matcha:    #2d4a2d;
      --matcha-l:  #3d6b3d;
      --matcha-xl: #5a8f5a;
      --ink:       #0e1a0e;
      --cream:     #f4ede0;
      --paper:     #faf7f2;
      --gold:      #b8963e;
      --gold-l:    #d4b06a;
      --mist:      rgba(45,74,45,.06);
    }

    html, body {
      height: 100%;
      background: var(--paper);
      font-family: 'Inter', sans-serif;
      color: var(--ink);
    }

    /* ══════════════════════════════════════════
       LAYOUT — two-panel split
    ══════════════════════════════════════════ */
    .shell {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    /* ── LEFT PANEL ──────────────────────────── */
    .panel-left {
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--matcha);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5rem;
      overflow: hidden;
    }

    /* large background kanji / calligraphy character — pure CSS text */
    .panel-left::before {
      content: '茶';
      position: absolute;
      bottom: -4rem;
      right: -2rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 26rem;
      font-weight: 300;
      color: rgba(255,255,255,.04);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .brand {
      position: relative;
      z-index: 1;
    }
    .brand-label {
      font-size: .7rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold-l);
      margin-bottom: .6rem;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.4rem;
      font-weight: 300;
      color: var(--cream);
      line-height: 1.05;
      letter-spacing: .02em;
    }
    .brand-name em {
      font-style: italic;
      color: var(--gold-l);
    }

    /* ── tea cup SVG (inline, no external resource) ── */
    .cup-art {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }
    .cup-art svg {
      width: 200px;
      height: 200px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,.25));
    }

    /* steam path animation */
    .steam-path {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw-steam 2s ease forwards infinite;
    }
    .steam-path:nth-child(2) { animation-delay: .4s; }
    .steam-path:nth-child(3) { animation-delay: .8s; }
    @keyframes draw-steam {
      0%   { stroke-dashoffset: 60; opacity: 0; }
      30%  { opacity: .7; }
      100% { stroke-dashoffset: 0;  opacity: 0; }
    }

    .panel-left-footer {
      position: relative;
      z-index: 1;
    }
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: rgba(244,237,224,.5);
      line-height: 1.6;
      max-width: 260px;
    }
    .tagline span {
      display: block;
      width: 32px;
      height: 1px;
      background: var(--gold);
      margin-bottom: .9rem;
    }

    /* ── RIGHT PANEL ─────────────────────────── */
    .panel-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 3rem;
      background: var(--paper);
    }

    .form-wrapper {
      width: 100%;
      max-width: 400px;
    }

    /* step indicator */
    .step-indicator {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 2.8rem;
    }
    .step-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--matcha-xl);
      opacity: .25;
      transition: opacity .3s, transform .3s;
    }
    .step-dot.active { opacity: 1; transform: scale(1.4); }
    .step-label {
      margin-left: .5rem;
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--matcha-xl);
    }

    .form-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 300;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: .6rem;
    }
    .form-heading em {
      font-style: italic;
      color: var(--matcha-l);
    }
    .form-sub {
      font-size: .82rem;
      color: rgba(14,26,14,.45);
      margin-bottom: 2.6rem;
      line-height: 1.6;
    }

    /* ── FIELD — underline style ──────────────── */
    .field {
      position: relative;
      margin-bottom: 2rem;
    }

    .field label {
      position: absolute;
      left: 0;
      top: .6rem;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(14,26,14,.4);
      pointer-events: none;
      transition: transform .22s cubic-bezier(.4,0,.2,1),
                  font-size .22s, color .22s;
      transform-origin: left center;
    }

    .field input,
    .field textarea {
      display: block;
      width: 100%;
      padding: .6rem 0 .55rem;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid rgba(14,26,14,.15);
      outline: none;
      font-size: .97rem;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      transition: border-color .25s;
      resize: none;
    }
    .field textarea { min-height: 56px; line-height: 1.5; padding-top: 1rem; }

    /* line fill on focus */
    .field::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1.5px;
      background: var(--matcha);
      transition: width .35s cubic-bezier(.4,0,.2,1);
    }
    .field:focus-within::after { width: 100%; }
    .field:focus-within label,
    .field.filled label {
      transform: translateY(-1.5rem) scale(.85);
      color: var(--matcha-l);
    }

    /* password toggle */
    .pw-toggle {
      position: absolute;
      right: 0; top: .45rem;
      background: none; border: none;
      cursor: pointer;
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(14,26,14,.3);
      transition: color .2s;
      padding: 0;
    }
    .pw-toggle:hover { color: var(--matcha); }

    /* ── two-col row ─── */
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; }

    /* ── PASSWORD STRENGTH ───────────────────── */
    .strength {
      display: flex;
      gap: 4px;
      margin-top: .5rem;
    }
    .strength-seg {
      flex: 1; height: 2px; border-radius: 1px;
      background: rgba(14,26,14,.1);
      transition: background .4s;
    }

    /* ── CONSENT ─────────────────────────────── */
    .consent {
      display: flex;
      align-items: flex-start;
      gap: .7rem;
      margin: .4rem 0 2.2rem;
    }
    .consent-box {
      appearance: none;
      -webkit-appearance: none;
      width: 16px; height: 16px;
      flex-shrink: 0;
      border: 1.5px solid rgba(14,26,14,.25);
      border-radius: 3px;
      margin-top: 2px;
      cursor: pointer;
      position: relative;
      transition: border-color .2s, background .2s;
    }
    .consent-box:checked {
      background: var(--matcha);
      border-color: var(--matcha);
    }
    .consent-box:checked::after {
      content: '';
      position: absolute;
      left: 4px; top: 1px;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(42deg);
    }
    .consent-text {
      font-size: .78rem;
      color: rgba(14,26,14,.45);
      line-height: 1.5;
    }
    .consent-text a {
      color: var(--matcha-l);
      text-decoration: underline dotted;
    }

    /* ── SUBMIT ──────────────────────────────── */
    .btn-submit {
      position: relative;
      width: 100%;
      padding: 1rem 2rem;
      border: 1.5px solid var(--matcha);
      border-radius: 0;
      background: transparent;
      color: var(--matcha);
      font-family: 'Inter', sans-serif;
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .22em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      transition: color .35s;
    }
    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--matcha);
      transform: translateX(-101%);
      transition: transform .4s cubic-bezier(.4,0,.2,1);
    }
    .btn-submit:hover::before { transform: translateX(0); }
    .btn-submit:hover { color: var(--cream); }
    .btn-submit span { position: relative; z-index: 1; }

    /* success state */
    .btn-submit.success {
      border-color: var(--gold);
      color: var(--gold);
    }
    .btn-submit.success::before { background: transparent; }

    /* ── sign-in link ─────────────────────────── */
    .signin-link {
      margin-top: 1.5rem;
      text-align: center;
      font-size: .78rem;
      color: rgba(14,26,14,.4);
    }
    .signin-link a {
      color: var(--matcha-l);
      text-decoration: none;
      font-weight: 500;
    }
    .signin-link a:hover { text-decoration: underline; }

    /* ══════════════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════════════ */
    @media (max-width: 768px) {
      .shell { grid-template-columns: 1fr; }

      .panel-left {
        position: relative;
        height: auto;
        padding: 2.4rem 2rem 3rem;
        min-height: 260px;
      }
      .panel-left::before { font-size: 14rem; bottom: -2rem; right: -1rem; }
      .cup-art { display: none; }

      .panel-right { padding: 2.8rem 1.8rem; }
      .row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- ══ LEFT ══════════════════════════════ -->
  <aside class="panel-left">
    <div class="brand">
      <p class="brand-label">Магазин рідкісного чаю</p>
      <h1 class="brand-name">Ча<br><em>До</em></h1>
    </div>

    <!-- SVG tea cup -->
    <div class="cup-art" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- steam -->
        <path class="steam-path" d="M80 55 C80 45 90 45 90 35 C90 25 80 25 80 15" stroke="#b8963e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path class="steam-path" d="M100 60 C100 48 112 48 112 36 C112 24 100 24 100 12" stroke="#b8963e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path class="steam-path" d="M120 55 C120 45 130 45 130 35 C130 25 120 25 120 15" stroke="#b8963e" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- saucer -->
        <ellipse cx="100" cy="162" rx="60" ry="8" fill="rgba(244,237,224,.15)" stroke="rgba(244,237,224,.35)" stroke-width="1.2"/>
        <!-- cup body -->
        <path d="M55 90 Q58 148 100 150 Q142 148 145 90 Z" fill="rgba(244,237,224,.12)" stroke="rgba(244,237,224,.5)" stroke-width="1.5"/>
        <!-- cup rim -->
        <ellipse cx="100" cy="90" rx="45" ry="7" fill="rgba(244,237,224,.08)" stroke="rgba(244,237,224,.5)" stroke-width="1.5"/>
        <!-- tea surface -->
        <ellipse cx="100" cy="90" rx="38" ry="5.5" fill="rgba(184,150,62,.3)" stroke="rgba(184,150,62,.5)" stroke-width="1"/>
        <!-- handle -->
        <path d="M145 100 C168 100 168 130 145 130" stroke="rgba(244,237,224,.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- tea leaves on surface -->
        <ellipse cx="95"  cy="90" rx="5" ry="2" fill="rgba(93,143,93,.6)"  transform="rotate(-20 95 90)"/>
        <ellipse cx="108" cy="91" rx="4" ry="1.5" fill="rgba(93,143,93,.5)" transform="rotate(15 108 91)"/>
      </svg>
    </div>

    <footer class="panel-left-footer">
      <p class="tagline">
        <span></span>
        Кожен ковток —<br>це маленька медитація
      </p>
    </footer>
  </aside>

  <!-- ══ RIGHT ═════════════════════════════ -->
  <main class="panel-right">
    <div class="form-wrapper">

      <!-- step dots -->
      <div class="step-indicator" aria-hidden="true">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <span class="step-label">Новий акаунт</span>
      </div>

      <h2 class="form-heading">Вітаємо<br><em>в колі своїх</em></h2>
      <p class="form-sub">Заповніть форму, щоб отримати доступ до добірок рідкісного чаю та ексклюзивних пропозицій.</p>

      <form id="regForm" novalidate>

        <!-- row: name -->
        <div class="row">
          <div class="field" id="f-first">
            <label for="firstName">Ім'я</label>
            <input id="firstName" name="firstName" type="text"
                   autocomplete="given-name" required
                   oninput="toggleFilled(this)" />
          </div>
          <div class="field" id="f-last">
            <label for="lastName">Прізвище</label>
            <input id="lastName" name="lastName" type="text"
                   autocomplete="family-name" required
                   oninput="toggleFilled(this)" />
          </div>
        </div>

        <!-- email -->
        <div class="field" id="f-email">
          <label for="email">Електронна пошта</label>
          <input id="email" name="email" type="email"
                 autocomplete="email" required
                 oninput="toggleFilled(this)" />
        </div>

        <!-- password -->
        <div class="field" id="f-pass">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password"
                 autocomplete="new-password" required
                 oninput="toggleFilled(this); calcStrength(this.value)" />
          <button type="button" class="pw-toggle" onclick="togglePw()"
                  id="pwBtn" aria-label="Показати пароль">показати</button>
        </div>
        <div class="strength" aria-hidden="true">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
          <div class="strength-seg" id="s4"></div>
        </div>

        <!-- address -->
        <div class="field" id="f-addr" style="margin-top:1.8rem">
          <label for="address">Адреса проживання</label>
          <textarea id="address" name="address"
                    autocomplete="street-address" required rows="2"
                    oninput="toggleFilled(this)"></textarea>
        </div>

        <!-- consent -->
        <div class="consent">
          <input type="checkbox" id="consent" class="consent-box" required />
          <label for="consent" class="consent-text">
            Я погоджуюся з <a href="#" onclick="return false">умовами сервісу</a>
            та <a href="#" onclick="return false">політикою конфіденційності</a>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span id="btnText">Розпочати подорож</span>
        </button>

        <p class="signin-link">Вже маєте акаунт? <a href="#">Увійти</a></p>

      </form>
    </div>
  </main>

</div>

<script>
  /* ── Float label helper ─────────────────── */
  function toggleFilled(el) {
    const field = el.closest('.field');
    field.classList.toggle('filled', el.value.trim() !== '');
  }

  /* on page load: mark pre-filled fields */
  document.querySelectorAll('.field input, .field textarea').forEach(el => {
    el.addEventListener('blur', () => toggleFilled(el));
  });

  /* ── Password show/hide ─────────────────── */
  function togglePw() {
    const pw  = document.getElementById('password');
    const btn = document.getElementById('pwBtn');
    const show = pw.type === 'password';
    pw.type  = show ? 'text' : 'password';
    btn.textContent = show ? 'сховати' : 'показати';
  }

  /* ── Password strength ──────────────────── */
  const SEG_COLORS = ['#e05252','#e8a23e','#a0c46d','#5a8f5a'];
  function calcStrength(v) {
    let s = 0;
    if (v.length >= 8)          s++;
    if (/[A-Z]/.test(v))        s++;
    if (/[0-9]/.test(v))        s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    for (let i = 1; i <= 4; i++) {
      const seg = document.getElementById('s' + i);
      seg.style.background = i <= s ? SEG_COLORS[s - 1] : 'rgba(14,26,14,.1)';
    }
    /* update step dots */
    const dots = [document.getElementById('dot1'),
                  document.getElementById('dot2'),
                  document.getElementById('dot3')];
    const allFilled = [...document.querySelectorAll('#regForm [required]')]
      .filter(el => el.type !== 'checkbox')
      .every(el => el.value.trim());
    dots[1].classList.toggle('active', s >= 2);
    dots[2].classList.toggle('active', allFilled && s >= 3);
  }

  /* ── Form submit ────────────────────────── */
  document.getElementById('regForm').addEventListener('submit', function(e) {
    e.preventDefault();

    /* validate */
    let firstInvalid = null;
    this.querySelectorAll('[required]').forEach(el => {
      const invalid = el.type === 'checkbox' ? !el.checked : !el.value.trim();
      if (invalid && !firstInvalid) firstInvalid = el;
      el.closest('.field, .consent')?.classList.toggle('has-error', invalid);
    });
    if (firstInvalid) { firstInvalid.focus(); return; }

    /* success */
    const btn = document.getElementById('submitBtn');
    const txt = document.getElementById('btnText');
    btn.classList.add('success');
    txt.textContent = '✦  Ласкаво просимо до Ча До';
    btn.disabled = true;

    /* all dots active */
    ['dot1','dot2','dot3'].forEach(id =>
      document.getElementById(id).classList.add('active'));
  });
</script>

<style>
  /* error highlight */
  .field.has-error input,
  .field.has-error textarea {
    border-bottom-color: #c0392b !important;
  }
  .field.has-error::after {
    background: #c0392b !important;
    width: 100%;
  }
  .field.has-error label { color: #c0392b !important; }
</style>

</body>
</html>
